plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.truesummit.wear'
    compileSdk 34

    defaultConfig {
        // Must match the phone app. Play delivers the watch APK under the same
        // listing, distinguished by the android.hardware.type.watch feature
        // rather than by package name, so a different id would stop the watch
        // app from ever reaching a paired device.
        applicationId "com.truesummit.android"
        minSdk 30
        targetSdk 34
        // Each APK in a multi-APK listing needs its own versionCode. Offsetting
        // the watch by 1000 keeps the two tracks from colliding as they bump.
        versionCode 1001
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'
    implementation 'androidx.wear.compose:compose-navigation:1.3.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Complications (watch face) and Tiles
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'androidx.wear.tiles:tiles:1.4.0'
    implementation 'androidx.wear.protolayout:protolayout:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.2.0'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.2.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
