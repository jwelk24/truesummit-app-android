services:
  - type: web
    name: summit-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_PRODUCTS
        value: transactions,investments,liabilities
      - key: PLAID_COUNTRY_CODES
        value: US
      - key: PLAID_LANGUAGE
        value: en
      - key: PLAID_REDIRECT_URI
        value: https://summit.local/plaid-redirect
      # Set in the Render dashboard, never committed. The app calls
      # /api/ai/generate instead of holding this key itself.
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://eebpmgilbguussctttgl.supabase.co
      # Anon key is public by design; used only to call Supabase's token
      # introspection endpoint when verifying a caller.
      - key: SUPABASE_ANON_KEY
        sync: false
